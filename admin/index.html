<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deliveroo — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241A2E;
    --ink-2:#33253F;
    --paper:#FBF6EF;
    --line:rgba(251,246,239,.12);
    --muted:rgba(251,246,239,.55);
    --mint:#3FA796;
    --saffron:#F2A93B;
    --pomegranate:#D64550;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:'Tajawal',sans-serif; min-height:100vh;
  }
  h1,h2,h3{font-family:'Cairo',sans-serif; margin:0;}
  button{font-family:inherit; cursor:pointer;}

  /* login */
  .login-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center;}
  .login-wrap .mark{font-size:2.4rem; margin-bottom:12px;}
  .login-wrap h1{font-size:1.35rem; margin-bottom:6px;}
  .login-wrap p{color:var(--muted); font-size:.85rem; margin:0 0 26px;}
  .login-wrap input{
    width:100%; max-width:320px; padding:14px 16px; border-radius:14px; margin-bottom:12px;
    border:1.5px solid var(--line); background:rgba(251,246,239,.06); color:var(--paper);
    font-family:inherit; font-size:.95rem; outline:none; text-align:center;
  }
  .btn-primary{
    width:100%; max-width:320px; background:var(--mint); color:#fff; border:none;
    border-radius:14px; padding:14px; font-weight:700; font-size:.93rem;
  }

  /* shell */
  .shell{display:none;}
  .shell.on{display:block;}
  header.top{
    position:sticky; top:0; z-index:20; background:var(--ink-2);
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{display:flex; align-items:center; gap:8px; font-family:'Cairo',sans-serif; font-weight:800;}
  header.top .brand .dot{width:8px; height:8px; border-radius:50%; background:var(--mint);}
  .logout{background:rgba(251,246,239,.08); border:none; color:var(--paper); border-radius:10px; padding:8px 14px; font-size:.78rem; font-weight:700;}

  /* stats */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; padding:18px;}
  .stat{background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:16px;}
  .stat b{display:block; font-family:'Cairo',sans-serif; font-size:1.6rem; line-height:1.2;}
  .stat span{font-size:.75rem; color:var(--muted);}
  .stat.accent b{color:var(--mint);}
  .stat.warn b{color:var(--saffron);}

  /* tabs */
  .tabs{display:flex; gap:8px; padding:0 18px 12px; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0; background:rgba(251,246,239,.06); border:1.5px solid transparent;
    color:var(--muted); border-radius:12px; padding:10px 18px; font-size:.82rem; font-weight:700;
  }
  .tab.on{background:var(--paper); color:var(--ink); border-color:var(--paper);}

  .pane{padding:0 18px 40px;}
  .card{
    background:var(--ink-2); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:12px;
  }
  .card .row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .card h4{margin:0; font-family:'Cairo',sans-serif; font-size:.98rem;}
  .id{font-size:.7rem; color:var(--muted); background:rgba(251,246,239,.07); padding:3px 9px; border-radius:8px;}
  .meta{font-size:.79rem; color:var(--muted); line-height:1.8;}
  .badge{display:inline-block; font-size:.71rem; font-weight:700; padding:4px 10px; border-radius:8px; margin-top:8px;}
  .b-new{background:rgba(242,169,63,.2); color:var(--saffron);}
  .b-live{background:rgba(63,167,150,.2); color:#8FDFCB;}
  .b-done{background:rgba(251,246,239,.1); color:var(--muted);}
  .b-custom{background:rgba(214,69,80,.2); color:#F4909A;}

  table{width:100%; border-collapse:collapse; font-size:.82rem;}
  th,td{padding:10px 8px; text-align:right; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:700; font-size:.75rem;}

  .empty{text-align:center; padding:50px 20px; color:var(--muted); font-size:.85rem; line-height:1.8;}
  .empty .ic{font-size:2.2rem; display:block; margin-bottom:10px;}

  .toast{
    position:fixed; bottom:24px; right:50%; transform:translateX(50%);
    background:var(--paper); color:var(--ink); padding:12px 22px; border-radius:12px;
    font-size:.85rem; font-weight:700; z-index:200; opacity:0; pointer-events:none; transition:.25s;
  }
  .toast.on{opacity:1; transform:translateX(50%) translateY(-6px);}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<meta name="theme-color" content="#241A2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Admin">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="icon" href="icon-512.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div style="margin-bottom:14px;">
    <svg width="170" height="52" viewBox="0 0 260 60" dir="ltr" style="direction:ltr;">
      <defs><clipPath id="beeAdmLogin"><ellipse cx="34" cy="30" rx="17" ry="10.5"/></clipPath></defs>
      <line x1="0" y1="38" x2="10" y2="38" stroke="var(--mint)" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
      <line x1="2" y1="44" x2="9" y2="44" stroke="var(--mint)" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
      <ellipse cx="24" cy="22" rx="10" ry="6" fill="var(--paper)" opacity=".3" transform="rotate(-18 24 22)"/>
      <ellipse cx="36" cy="20" rx="10" ry="6" fill="var(--paper)" opacity=".25" transform="rotate(12 36 20)"/>
      <ellipse cx="34" cy="30" rx="17" ry="10.5" fill="var(--paper)"/>
      <g clip-path="url(#beeAdmLogin)">
        <rect x="24" y="19" width="5.5" height="22" fill="var(--saffron)"/>
        <rect x="36" y="19" width="5.5" height="22" fill="var(--saffron)"/>
      </g>
      <circle cx="16" cy="30" r="6.5" fill="var(--paper)"/>
      <path d="M14 25 Q9 17 5 14" stroke="var(--paper)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M19 25 Q19 16 22 13" stroke="var(--paper)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M50 30 L58 30 L50 25 Z" fill="var(--paper)"/>
      <text x="72" y="28" font-family="Cairo, sans-serif" font-weight="800" font-size="24" font-style="italic" fill="var(--paper)">Deliveroo</text>
      <text x="74" y="44" font-family="Tajawal, sans-serif" font-weight="700" font-size="11" letter-spacing="4" fill="var(--saffron)">ADMIN</text>
    </svg>
  </div>
  <h1>لوحة تحكم Deliveroo</h1>
  <p>الدخول مخصص لإدارة التطبيق فقط</p>
  <button class="btn-primary" style="display:flex; align-items:center; justify-content:center; gap:10px; background:#fff; color:#241A2E;" onclick="adminLogin()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.4 0-13.8 4.2-17 10.3z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2 14-5.2l-6.5-5.4C29.5 35.1 26.9 36 24 36c-5.4 0-9.9-3.4-11.5-8.2l-6.5 5C9.8 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.7 4.7-5 6.1l6.5 5.4C40.5 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    الدخول بحساب جوجل
  </button>
  <p id="loginError" style="color:#F4909A; font-size:.82rem; margin-top:16px; display:none;"></p>
</div>

<div class="shell" id="shell">
  <header class="top">
    <div class="brand">
      <svg width="34" height="22" viewBox="0 0 62 30" dir="ltr" style="direction:ltr; flex-shrink:0;">
        <defs><clipPath id="beeAdm"><ellipse cx="34" cy="16" rx="15" ry="9"/></clipPath></defs>
        <line x1="0" y1="22" x2="8" y2="22" stroke="var(--mint)" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
        <line x1="2" y1="27" x2="8" y2="27" stroke="var(--mint)" stroke-width="2.2" stroke-linecap="round" opacity=".45"/>
        <ellipse cx="25" cy="9" rx="9" ry="5" fill="var(--paper)" opacity=".32" transform="rotate(-18 25 9)"/>
        <ellipse cx="36" cy="7" rx="9" ry="5" fill="var(--paper)" opacity=".26" transform="rotate(12 36 7)"/>
        <ellipse cx="34" cy="16" rx="15" ry="9" fill="var(--paper)"/>
        <g clip-path="url(#beeAdm)">
          <rect x="25" y="6" width="4.8" height="20" fill="var(--saffron)"/>
          <rect x="36" y="6" width="4.8" height="20" fill="var(--saffron)"/>
        </g>
        <circle cx="17" cy="16" r="5.6" fill="var(--paper)"/>
        <path d="M15 11 Q11 4 7 2" stroke="var(--paper)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M20 11 Q20 4 23 1" stroke="var(--paper)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M49 16 L57 16 L49 11 Z" fill="var(--paper)"/>
      </svg>
      <span style="font-style:italic; letter-spacing:.3px;">Deliveroo <span style="font-size:.72rem; opacity:.7; font-style:normal;">Admin</span></span>
    </div>
    <button class="logout" onclick="adminLogout()">خروج</button>
  </header>

  <div class="stats">
    <div class="stat warn"><b id="sNew">0</b><span>طلبات جديدة</span></div>
    <div class="stat accent"><b id="sLive">0</b><span>جاري توصيلها</span></div>
    <div class="stat"><b id="sDone">0</b><span>تم تسليمها</span></div>
    <div class="stat accent"><b id="sRevenue">0</b><span>إجمالي المبيعات (ج.م)</span></div>
    <div class="stat"><b id="sUsers">0</b><span>عملاء مسجلين</span></div>
    <div class="stat"><b id="sAvg">0</b><span>متوسط الطلب (ج.م)</span></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="orders" onclick="switchTab('orders')">الطلبات</button>
    <button class="tab" data-t="customers" onclick="switchTab('customers')">العملاء</button>
    <button class="tab" data-t="drivers" onclick="switchTab('drivers')">المندوبين</button>
    <button class="tab" data-t="products" onclick="switchTab('products')">أكثر المنتجات طلبًا</button>
  </div>

  <div class="pane" id="pane"><div class="empty">جاري التحميل...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCcYku_xGf7_oOm7uchbj5WYSPWAbl2XcM",
    authDomain: "deliveroo-app-994df.firebaseapp.com",
    databaseURL: "https://deliveroo-app-994df-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "deliveroo-app-994df",
    storageBucket: "deliveroo-app-994df.firebasestorage.app",
    messagingSenderId: "1033005656970",
    appId: "1:1033005656970:web:e8c18489ee21cfe422b673",
  };
  // لو مكتبة Firebase مش اتحمّلت (مفيش نت، أو البيئة بتمنع الملفات الخارجية)، نوضح السبب للمستخدم بدل ما الصفحة تقف من غير رسالة
  if(typeof firebase === 'undefined'){
    document.body.innerHTML = `
      <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; font-family:Tajawal,sans-serif; color:#FBF6EF;">
        <div style="font-size:2.4rem; margin-bottom:14px;">⚠️</div>
        <h1 style="font-family:Cairo,sans-serif; font-size:1.2rem; margin:0 0 10px;">تعذر الاتصال بقاعدة البيانات</h1>
        <p style="color:rgba(251,246,239,.6); font-size:.88rem; line-height:1.9; max-width:340px; margin:0;">
          مكتبة Firebase مش اتحمّلت. تأكد إنك متصل بالإنترنت، ويفضّل تحمّل الملف على جهازك وتفتحه من متصفح عادي (زي Chrome) بدل المعاينة السريعة.
        </p>
      </div>`;
    throw new Error('Firebase SDK failed to load');
  }
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  // الإيميلات المصرّح لها بدخول لوحة التحكم
  const ADMIN_EMAILS = ['waleedgamaln@gmail.com'];

  const STEPS = ['تم استلام الطلب','جاري التحضير','المندوب في الطريق','تم التوصيل'];
  let tab = 'orders';
  let ordersCache = {}, usersCache = {};

  function adminLogin(){
    const provider = new firebase.auth.GoogleAuthProvider();
    // نجرب popup الأول، ولو المتصفح منعها نرجع لـ redirect (بيشتغل في حالات أكتر)
    auth.signInWithPopup(provider).catch(err => {
      if(err && (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')){
        auth.signInWithRedirect(provider);
      } else if(err && err.code === 'auth/unauthorized-domain'){
        showLoginError('الدومين ده مش مصرّح له في Firebase. ارفع الملف على استضافة (زي Firebase Hosting) أو ضيف الدومين في Authentication ← Settings ← Authorized domains');
      } else {
        showLoginError('تعذر تسجيل الدخول: ' + (err && err.code ? err.code : 'خطأ غير معروف'));
      }
    });
  }
  function adminLogout(){ auth.signOut().then(() => location.reload()); }

  function showLoginError(msg){
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  auth.onAuthStateChanged(user => {
    if(!user) return;
    if(!ADMIN_EMAILS.includes((user.email || '').toLowerCase())){
      showLoginError('الحساب ده مش مصرّح له بدخول لوحة التحكم');
      auth.signOut();
      return;
    }
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('shell').classList.add('on');
    start();
  });

  function start(){
    db.ref('orders').on('value', s => { ordersCache = s.val() || {}; refresh(); });
    db.ref('users').on('value', s => { usersCache = s.val() || {}; refresh(); });
  }

  function orderTotal(o){
    if(!o.items) return 0;
    return o.items.reduce((a,i) => a + (i.price || 0) * (i.qty || 1), 0);
  }

  function refresh(){
    const list = Object.entries(ordersCache);
    const done = list.filter(([,o]) => o.step >= STEPS.length - 1);
    const revenue = done.reduce((a,[,o]) => a + orderTotal(o), 0);
    document.getElementById('sNew').textContent = list.filter(([,o]) => o.step === 0).length;
    document.getElementById('sLive').textContent = list.filter(([,o]) => o.step > 0 && o.step < STEPS.length - 1).length;
    document.getElementById('sDone').textContent = done.length;
    document.getElementById('sRevenue').textContent = revenue.toLocaleString('ar-EG');
    document.getElementById('sUsers').textContent = Object.keys(usersCache).length;
    document.getElementById('sAvg').textContent = done.length ? Math.round(revenue / done.length) : 0;
    render();
  }

  function switchTab(t){
    tab = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    render();
  }

  function render(){
    const pane = document.getElementById('pane');
    if(tab === 'orders') pane.innerHTML = renderOrders();
    else if(tab === 'customers') pane.innerHTML = renderCustomers();
    else if(tab === 'drivers') pane.innerHTML = renderDrivers();
    else pane.innerHTML = renderProducts();
  }

  function renderOrders(){
    const list = Object.entries(ordersCache).sort((a,b) => (b[1].placedAt||0) - (a[1].placedAt||0));
    if(!list.length) return `<div class="empty"><span class="ic">📭</span>مفيش طلبات لسه.<br>أول ما عميل يطلب، هيظهر هنا فورًا.</div>`;
    return list.map(([id,o]) => {
      const u = usersCache[o.customerId] || {};
      const badge = o.step >= STEPS.length-1 ? 'b-done' : (o.step === 0 ? 'b-new' : 'b-live');
      const items = o.custom ? o.items[0].item : o.items.map(i => `${i.item} ×${i.qty}`).join('، ');
      return `<div class="card">
        <div class="row"><h4>${o.custom ? 'طلب مخصوص' : (o.items[0]?.vendorName || '')}</h4><span class="id">#${id.slice(-5)}</span></div>
        <div class="meta">${items}</div>
        <div class="meta">👤 ${u.firstName || ''} ${u.lastName || ''} · 📱 ${o.customerPhone || u.phone || '-'}</div>
        <div class="meta">📍 ${u.location || '-'}${o.driverName ? ` · 🛵 ${o.driverName}` : ''}</div>
        <div class="meta">💰 ${orderTotal(o).toLocaleString('ar-EG')} ج.م</div>
        <span class="badge ${badge}">${STEPS[Math.min(o.step, STEPS.length-1)]}</span>
        ${o.custom ? '<span class="badge b-custom">مخصوص</span>' : ''}
      </div>`;
    }).join('');
  }

  function renderCustomers(){
    const list = Object.entries(usersCache);
    if(!list.length) return `<div class="empty"><span class="ic">👥</span>مفيش عملاء مسجلين لسه.</div>`;
    return `<div class="card"><table>
      <tr><th>الاسم</th><th>الموبايل</th><th>المنطقة</th><th>طلبات</th></tr>
      ${list.map(([uid,u]) => {
        const n = Object.values(ordersCache).filter(o => o.customerId === uid).length;
        return `<tr>
          <td>${u.firstName||''} ${u.lastName||''}</td>
          <td>${u.phone||'-'}</td>
          <td>${u.location||'-'}</td>
          <td>${n}</td>
        </tr>`;
      }).join('')}
    </table></div>`;
  }

  function renderDrivers(){
    const map = {};
    Object.values(ordersCache).forEach(o => {
      if(!o.driverId) return;
      if(!map[o.driverId]) map[o.driverId] = { name:o.driverName||'مندوب', total:0, done:0, revenue:0 };
      map[o.driverId].total++;
      if(o.step >= STEPS.length-1){ map[o.driverId].done++; map[o.driverId].revenue += orderTotal(o); }
    });
    const list = Object.entries(map);
    if(!list.length) return `<div class="empty"><span class="ic">🛵</span>مفيش مندوب قبل أي طلب لسه.</div>`;
    return `<div class="card"><table>
      <tr><th>المندوب</th><th>طلبات استلمها</th><th>سلّمها</th><th>قيمة (ج.م)</th></tr>
      ${list.map(([,d]) => `<tr><td>${d.name}</td><td>${d.total}</td><td>${d.done}</td><td>${d.revenue.toLocaleString('ar-EG')}</td></tr>`).join('')}
    </table></div>`;
  }

  function renderProducts(){
    const map = {};
    Object.values(ordersCache).forEach(o => {
      if(o.custom || !o.items) return;
      o.items.forEach(i => {
        if(!map[i.item]) map[i.item] = { qty:0, revenue:0, vendor:i.vendorName || '' };
        map[i.item].qty += (i.qty||1);
        map[i.item].revenue += (i.price||0) * (i.qty||1);
      });
    });
    const list = Object.entries(map).sort((a,b) => b[1].qty - a[1].qty).slice(0, 30);
    if(!list.length) return `<div class="empty"><span class="ic">📊</span>لسه مفيش مبيعات نحللها.</div>`;
    return `<div class="card"><table>
      <tr><th>الصنف</th><th>المتجر</th><th>الكمية</th><th>الإيراد (ج.م)</th></tr>
      ${list.map(([name,d]) => `<tr><td>${name}</td><td>${d.vendor}</td><td>${d.qty}</td><td>${d.revenue.toLocaleString('ar-EG')}</td></tr>`).join('')}
    </table></div>`;
  }

  let tt;
  function toast(m){
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200);
  }
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
